# Default configuration for MPAS multi-agent forecast workflow
#
# This file provides sensible defaults for all settings.
# Override these in:
# - config/platforms/{platform}.yaml for platform-specific settings
# - config/experiment_config.yaml for your experiment customizations

executors:
  # Agent executor - where agents run
  agent-executor:
    provider: "localhost"
    cores_per_node: 8
    max_workers_per_node: 4

  metis-executors: agent-executor
