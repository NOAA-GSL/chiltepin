# User configuration template for MPAS multi-agent forecast workflow
#
# Copy this file to user_config.yaml and customize for your experiment:
#   cp config/user_config.yaml.template config/user_config.yaml
#
# This file overrides default_config.yaml and platform-specific configs.
# Only specify settings you want to change from the defaults.

# =============================================================================
# REQUIRED: Paths
# =============================================================================

# Experiment directory (customize for your system)
experiment_dir: /home/admin/experiments/mpas_forecast/local

workflow_config:
  agent-executor:
    provider: localhost
    max_blocks: 1
    max_workers_per_node: 4
    environment:
      - export PYTHONPATH=$PYTHONPATH:/home/admin/chiltepin/examples/mpas

agents:
  - name: mesh-foo
    type: mesh
    work_dir: /home/admin/experiments/mpas_forecast/site_foo
    executor: agent-executor
    workflow_config:
      service:
        provider: slurm
        partition: slurmpar
        nodes_per_block: 1
        walltime: "00:10:00"
        environment:
          # - source /home/admin/chiltepin/examples/mpas/miniforge3/etc/profile.d/conda.sh
          # - conda activate mpas-example
          - export PYTHONPATH=$PYTHONPATH:/home/admin/chiltepin/examples/mpas
      compute:
        provider: slurm
        partition: slurmpar
        nodes_per_block: 1
        walltime: "00:10:00"
        environment:
          - source /usr/lmod/lmod/init/bash
          - module use /opt/spack-stack/envs/unified-env/modules/Core
          - module load stack-gcc
          - module load cmake
          # - source /home/admin/chiltepin/examples/mpas/miniforge3/etc/profile.d/conda.sh
          # - conda activate mpas-example
          - export PYTHONPATH=$PYTHONPATH:/home/admin/chiltepin/examples/mpas

  - name: mpas-foo
    type: mpas
    work_dir: /home/admin/experiments/mpas_forecast/site_foo
    executor: agent-executor
    workflow_config:
      service:
        provider: slurm
        partition: slurmpar
        nodes_per_block: 1
        walltime: "00:10:00"
        environment:
          # - source /home/admin/chiltepin/examples/mpas/miniforge3/etc/profile.d/conda.sh
          # - conda activate mpas-example
          - export PYTHONPATH=$PYTHONPATH:/home/admin/chiltepin/examples/mpas
      compute:
        provider: slurm
        partition: slurmpar
        nodes_per_block: 1
        walltime: "00:10:00"
        environment:
          - source /usr/lmod/lmod/init/bash
          - module use /opt/spack-stack/envs/unified-env/modules/Core
          - module load stack-gcc
          - module load stack-openmpi
          - module load cmake
          - module load parallel-netcdf
          - module load parallelio
          # - source /home/admin/chiltepin/examples/mpas/miniforge3/etc/profile.d/conda.sh
          # - conda activate mpas-example
          - export PYTHONPATH=$PYTHONPATH:/home/admin/chiltepin/examples/mpas

  # - name: mesh-bar
  #   type: mesh
  #   work_dir: /home/admin/experiments/mpas_forecast/site_bar
  #   executor: agent-executor
  #   workflow_config:
  #     service:
  #       provider: slurm
