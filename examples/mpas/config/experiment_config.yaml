# =============================================================================
# OPTIONAL: Model Configuration
# =============================================================================

# Uncomment and customize as needed
model:
  mesh:
    name: hexes
    resolution: 60km
    # Add regional specs for regional meshes
    regional:
      # Choose either "project_hexes" or "create_region" method
      project_hexes:
        extent_x_km: 5403.0
        extent_y_km: 3183.0
        center_lat: 38.5
        center_lon: -97.5
        rotation_degrees: 0.0 # Birds-eye counter-clockwise
      # create_region:  # Choose one of the types: "polygon", "circle", "ellipse", "channel"
        # polygon:
        #   point: 38.5, -97.5  # A point inside the polygon
        #   vertices:  # In counter clock-wise order (can be any convex shape)
        #   - 21.03, -122.82
        #   - 47.94, -134.20
        #   - 47.94, -60.80
        #   - 21.03, -72.18
        # circle:
        #   point: 39.0, -105.5 # Center
        #   radius: 400000  # Meters
        # ellipse:
        #   point: 40.0, -98.5 # Center
        #   semi-major-axis: 3500000  # Meters (oriented N/S before rotation)
        #   semi-minor-axis: 2000000  # Meters (oriented E/W before rotation)
        #   orientation-angle: 90 # Clockwise rotation from north
        # channel:
        #   upper-lat: 23.43676
        #   lower-lat: -23.43676

#   # Forecast settings
#   forecast_length_hours: 24
#   output_interval_hours: 1
#
#   # MPI configuration
  init_ranks: 24
  forecast_ranks: 48

